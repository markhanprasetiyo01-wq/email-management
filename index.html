<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Meta viewport memastikan tampilan responsif di layar ponsel maupun desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aplikasi modern untuk memanajemen email terdaftar di game apa saja beserta statusnya: Live, Praregistrasi, dan Maintenance." />
    
    <title>GameMail Hub — Manajemen Akun & Status Game</title>
    
    <!-- Favicon modern menggunakan vector SVG GamePad -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='6' width='20' height='12' rx='6'/><path d='M6 12h4m-2-2v4m7-2h.01m3 0h.01'/></svg>" />
    
    <!-- Memuat Font Kustom dari Google Fonts: Outfit (Judul), Plus Jakarta Sans (Teks), & JetBrains Mono (Email/Kode) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Elemen root (Wadah Utama Aplikasi). Seluruh UI dibangun dan disuntikkan ke sini oleh src/main.js -->
    <div id="app"></div>

    <!-- Script entry point Vite (ES Module) -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
